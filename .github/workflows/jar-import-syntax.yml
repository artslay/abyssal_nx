name: jar-import-syntax

on:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib headers
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Check native importer syntax
        run: g++ -std=gnu++17 -Wall -Wextra -Isource -fsyntax-only source/jar_import.cpp
